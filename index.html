<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑步跑起来 paobu.org 探索全球最美跑步圣地</title>
    <meta name="description" content="探索世界各地最美的跑步路线，从城市路跑到山地越野，发现全球跑步圣地">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo-section">
                <a href="index.html" class="logo">
                    <span class="logo-icon">🏃</span>
                    <span class="logo-text">跑步跑起来</span>
                </a>
            </div>
            
            <nav class="main-nav" id="mainNav">
                <button class="nav-toggle" id="navToggle" aria-label="打开导航菜单">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-menu" id="navMenu">
                    <li><a href="#" class="nav-link active" onclick="navigation.showHome(); return false;">首页</a></li>
                    <li><a href="#" class="nav-link" onclick="navigation.showContinentsPage(); return false;">大洲</a></li>
                    <li><a href="#" class="nav-link" onclick="navigation.showTagsPage(); return false;">标签</a></li>
                    <li><a href="#" class="nav-link" onclick="navigation.showDifficultyPage(); return false;">难度</a></li>
                </ul>
            </nav>
            
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="切换暗色模式">
                    <span class="theme-icon">🌙</span>
                </button>
                <button class="search-toggle" id="searchToggle" aria-label="打开搜索">
                    <span class="search-icon">🔍</span>
                </button>
            </div>
        </div>
        
        <div class="search-overlay" id="searchOverlay">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索路线名称或地点...">
                <button class="search-close" id="searchClose">✕</button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>
    </header>

    <main class="main-content">
        <section class="breadcrumb-section" id="breadcrumbSection" style="margin-top: 0;">
            <nav class="breadcrumb" id="breadcrumb" aria-label="面包屑导航">
                <ol class="breadcrumb-list">
                    <li class="breadcrumb-item"><a href="index.html">首页</a></li>
                </ol>
            </nav>
        </section>

        <section class="tags-section" id="tags">
            <div class="container">
                <div class="tags-cloud" id="tagsCloud">
                </div>
            </div>
        </section>

        <section class="difficulty-section" id="difficulty">
            <div class="container">
                <div class="difficulty-grid" id="difficultyGrid">
                </div>
            </div>
        </section>

        <section class="continents-section" id="continents">
            <div class="container">
                <div class="continents-grid" id="continentsGrid">
                </div>
            </div>
        </section>

        <section class="routes-section" id="routes">
            <div class="container">
                <div class="routes-filter" id="routesFilter">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="road">路跑</button>
                    <button class="filter-btn" data-filter="trail">越野跑</button>
                    <button class="filter-btn" data-filter="marathon">马拉松</button>
                </div>
                <div class="routes-waterfall" id="routesWaterfall">
                </div>
                <div class="loading-indicator" id="loadingIndicator">
                    <div class="spinner"></div>
                    <span>加载中...</span>
                </div>
            </div>
        </section>

        <section class="route-detail-section" id="routeDetail" style="display: none;">
            <div class="container">
                <div class="route-detail" id="routeDetailContent">
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer" id="about">
        <div class="footer-container">
            <div class="footer-stats">
                <div class="footer-stat-item">
                    <span class="footer-stat-number" id="totalRoutes">0</span><span class="footer-stat-label">精选路线</span>
                </div>
                <div class="footer-stat-item">
                    <span class="footer-stat-number" id="totalCountries">0</span><span class="footer-stat-label">国家地区</span>
                </div>
                <div class="footer-stat-item">
                    <span class="footer-stat-number" id="totalContinents">0</span><span class="footer-stat-label">大洲</span>
                </div>
            </div>
            <div class="footer-copyright">
                <p>&copy; 2026 跑步跑起来 paobu.org 发现全球最美跑步路线，从城市街道到山野小径。</p>
            </div>
        </div>
    </footer>

    <!-- Data Files -->
    <script src="data/asia/china.js"></script>
    <script src="data/asia/japan.js"></script>
    <script src="data/asia/singapore.js"></script>
    <script src="data/asia/uae.js"></script>
    <script src="data/north-america/usa.js"></script>
    <script src="data/north-america/canada.js"></script>
    <script src="data/europe/uk.js"></script>
    <script src="data/europe/france.js"></script>
    <script src="data/europe/switzerland.js"></script>
    <script src="data/europe/germany.js"></script>
    <script src="data/europe/italy.js"></script>
    <script src="data/oceania/australia.js"></script>
    <script src="data/oceania/newzealand.js"></script>
    <script src="data/africa/south-africa.js"></script>
    <script src="data/africa/tanzania.js"></script>
    <script src="data/south-america/brazil.js"></script>
    <script src="data/south-america/peru.js"></script>
    <script src="data/south-america/argentina.js"></script>
    
    <script src="js/app.js"></script>
</body>
</html>
